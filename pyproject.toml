[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SELlib"
version = "3.0.1"
description = "Read and write the file formats an SEL protective relay project is made of: RDB, SET_*.TXT, DNP3 maps, GLE logic diagrams, SELOGIC and IEC 61850 SCL"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Marini" }]
keywords = ["sel", "acselerator", "rdb", "selogic", "dnp3", "iec61850", "scl",
            "protection", "relay", "commissioning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "olefile>=0.47",
    "openpyxl>=3.1",
    "cfbwrite>=1.0",
    # `>=0.3.0` and not `>=0.3.0.dev2`: the final is published, so the pin no
    # longer has to name a pre-release. Keep it that way. PEP 440 sorts a
    # `.devN` BEFORE its release, so naming one is both unnecessary once the
    # final exists and a standing invitation for a resolver to install it.
    #
    # **Unbounded above, deliberately -- do not add a ceiling here.** This
    # package only READS through `py61850.scl` and touches nothing in its edit
    # layer, so it is compatible with every line published so far, and
    # `requires-python` is what already makes an unbounded pin safe: 0.5.0
    # declares `>=3.13`, so a resolver on 3.10-3.12 is served 0.4.0 and one on
    # 3.13+ is served 0.5.0. Both work. Measured on 2026-09-15 rather than
    # assumed: 275 tests pass here against py61850 0.5.0 on Python 3.14.6.
    #
    # A ceiling would also break the consumer. `pac-ct` installs this package
    # AND py61850 together and pins `py61850>=0.5.0,<0.6`; a `<0.5` here would
    # leave that resolution with no solution at all.
    "py61850>=0.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/GuilhermeMarini/sellib"
Source = "https://github.com/GuilhermeMarini/sellib"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sellib = ["data/**/*.json", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
