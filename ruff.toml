line-length = 88
target-version = "py310"
src = ["src", "tests"]

[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[lint.per-file-ignores]
# A tokenizer table: `toks.append(Tok(...)); i += 1; continue` on one line is
# what makes the 14 branches read as the table they are.
"src/sellib/selogic/parser.py" = ["E702"]

[lint.isort]
known-first-party = ["sellib"]
